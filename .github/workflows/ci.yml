name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Run unit tests
        run: swift test

      - name: Build and validate app bundle
        env:
          ARCHS: "arm64 x86_64"
          OUTPUT_DIR: "${{ runner.temp }}/eq-for-mac"
        run: |
          scripts/build-app.sh
          lipo "${{ runner.temp }}/eq-for-mac/EQ for Mac.app/Contents/MacOS/EQForMac" \
            -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 \
            "${{ runner.temp }}/eq-for-mac/EQ for Mac.app"
          codesign -d --verbose=4 \
            "${{ runner.temp }}/eq-for-mac/EQ for Mac.app" 2>&1 | grep -q "Signature=adhoc"
